name: Regression tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: '123456:test-token-not-real'
      DESIGNER_CHAT_ID: '777'
      WEBAPP_URL: 'https://example.invalid'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node --check webapp/js/app.js
      - run: node --check webapp/js/boot.js
      - run: node --check webapp/js/case-viewer.js
      - run: node --test tests/test_webapp_ux.cjs tests/test_webapp_boot.cjs tests/test_case_viewer.cjs
  portfolio-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium for portfolio checks
        run: |
          npm install --prefix "$RUNNER_TEMP/portfolio-browser" --no-save playwright@1.62.1
          "$RUNNER_TEMP/portfolio-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check demo portfolio at three viewport widths
        run: NODE_PATH="$RUNNER_TEMP/portfolio-browser/node_modules" node tests/test_portfolio_browser.cjs
