<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Дизайнер — портфолио и заявки</title>
<link rel="stylesheet" href="/css/style.css" />
<!-- Официальный SDK Telegram для Mini Apps — обязателен для работы внутри Telegram.
     defer — иначе это блокирующий тег в <head>: пока telegram.org не отдаст
     скрипт, браузер не отрисует вообще ничего. У части пользователей были
     проблемы именно с доступом к telegram.org (не к нашему серверу) — из-за
     блокирующей загрузки вся страница у них оставалась пустой навсегда. С
     defer скрипты выполняются по порядку уже после разбора HTML, не блокируя
     отрисовку — а app.js и так корректно работает, если Telegram.WebApp не
     подгрузился (см. `realTG` в app.js). -->
<script src="https://telegram.org/js/telegram-web-app.js" defer></script>
</head>
<body>
  <div id="app"></div>
  <script src="/js/calculator.js" defer></script>
  <script src="/js/app.js" defer></script>
</body>
</html>
