<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Order Builder — regression tests (no pre-checked options)</title>
<style>
  body { font-family: monospace; padding: 16px; background: #111; color: #eee; }
  .pass { color: #4caf50; }
  .fail { color: #f44336; font-weight: bold; }
  #results { white-space: pre-wrap; margin-top: 16px; }
  #app { display: none; } /* реальный app-контейнер нужен render(), но нам не нужно его видеть */
</style>
</head>
<body>
<h1>Order Builder regression tests</h1>
<p>Проверяет, что "Хочу похожий проект" и прямой выбор услуги никогда не
предзаполняют опции Order Builder (см. UX-аудит: order_template.options —
неподдерживаемые demo-данные, нет доказательства их привязки к кейсу).</p>
<div id="results">Running…</div>
<div id="app"></div>

<script src="../js/calculator.js"></script>
<script src="../js/app.js"></script>
<script>
// ---- Тестовые фикстуры (форма данных зеркалит data/pricing.json / data/portfolio.json) ----
const FIXTURE_PRICING = {
  services: [
    { id: "LEND", name: "Лендинг", base_price: 25000, term_min: 7, term_max: 10, includes: "Прототип, UX, UI" },
    { id: "BRAND", name: "Брендинг", base_price: 40000, term_min: 10, term_max: 20, includes: "Логотип, стиль" },
  ],
  options: [
    { service_id: "LEND", id: "LEND_1", name: "Доп. страница", price: 5000, days: 2, multipliable: false },
    { service_id: "LEND", id: "LEND_2", name: "Адаптивная вёрстка", price: 3000, days: 1, multipliable: true },
    { service_id: "BRAND", id: "BRAND_1", name: "Гайдлайн", price: 8000, days: 3, multipliable: false },
  ],
  groups: [],
  rounding: { price_from_factor: 0.95, price_to_factor: 1.05, round_to: 500 },
  coefficients: { urgent: { label: "Срочно", multiplier: 1.25 }, complex: { label: "Сложно", multiplier: 1.2 } },
};

// Кейс, у которого ЕСТЬ order_template с опциями — ровно та форма данных,
// что реально лежит в data/portfolio.json (см. UX-аудит) и раньше вызывала
// самопроизвольно отмеченный чекбокс.
const CASE_WITH_ORDER_TEMPLATE = {
  id: "case_test_brand",
  title: "Тестовый брендинг-кейс",
  images: [],
  task: "т", solution: "р", result: "з",
  related_service: "BRAND",
  order_template: { service_id: "BRAND", options: [{ option_id: "BRAND_1", quantity: 1 }] },
};

// Кейс БЕЗ order_template вообще (как у любого кейса, добавленного через
// /admin сейчас — content_store.add_case это поле не создаёт) — serviceId
// должен браться из related_service, opций всё равно не должно быть.
const CASE_WITHOUT_ORDER_TEMPLATE = {
  id: "case_test_lend",
  title: "Тестовый лендинг-кейс без order_template",
  images: [],
  task: "т", solution: "р", result: "з",
  related_service: "LEND",
};

const results = [];
function check(name, condition, detail) {
  results.push({ name, pass: !!condition, detail });
}

function resetGlobalState() {
  state.pricing = FIXTURE_PRICING;
  state.portfolio = { cases: [CASE_WITH_ORDER_TEMPLATE, CASE_WITHOUT_ORDER_TEMPLATE], types: [] };
  state.uiConfig = { menu: {} };
  state.about = { experience: [] };
  state.screen = "portfolio";
  state.history = [];
  state.filter = "all";
  state.currentCase = null;
  state.brief.step = 1;
  state.brief.serviceId = null;
  state.brief.serviceName = null;
  state.brief.orderOptions = {};
  state.brief.urgent = false;
  state.brief.complex = false;
  state.brief.source = "direct";
  state.brief.sourceCaseId = null;
  state.brief.sourceCaseTitle = null;
  clearBriefDraft();
}

// ---- Тест 1: "Хочу похожий проект" из кейса С order_template.options ----
function testWantSimilarWithOrderTemplate() {
  resetGlobalState();
  state.currentCase = CASE_WITH_ORDER_TEMPLATE;
  state.screen = "case";
  render(); // рисует экран кейса и вызывает attachCaseEvents()

  document.getElementById("want-similar").click();

  check(
    "want-similar: serviceId сохраняется из related_service/order_template.service_id",
    state.brief.serviceId === "BRAND",
    `serviceId=${state.brief.serviceId}`
  );
  check(
    "want-similar: orderOptions === {} (не предзаполнен из order_template.options)",
    Object.keys(state.brief.orderOptions).length === 0,
    `orderOptions=${JSON.stringify(state.brief.orderOptions)}`
  );
  check(
    "want-similar: source/sourceCaseId проставлены корректно",
    state.brief.source === "case" && state.brief.sourceCaseId === "case_test_brand",
    `source=${state.brief.source} sourceCaseId=${state.brief.sourceCaseId}`
  );

  // render() уже произошёл внутри navigate() -> проверяем реальный DOM Order Builder'а
  const checkboxes = Array.from(document.querySelectorAll("[data-order-option-toggle]"));
  check(
    "want-similar: в реальном DOM есть чекбоксы опций Order Builder'а",
    checkboxes.length > 0,
    `count=${checkboxes.length}`
  );
  const anyChecked = checkboxes.some((el) => el.checked);
  check(
    "want-similar: ни один checkbox не отмечен checked=true",
    !anyChecked,
    `checked ids=${checkboxes.filter((el) => el.checked).map((el) => el.dataset.orderOptionToggle).join(",") || "(none)"}`
  );
}

// ---- Тест 2: "Хочу похожий проект" из кейса БЕЗ order_template ----
function testWantSimilarWithoutOrderTemplate() {
  resetGlobalState();
  state.currentCase = CASE_WITHOUT_ORDER_TEMPLATE;
  state.screen = "case";
  render();

  document.getElementById("want-similar").click();

  check(
    "want-similar (no template): serviceId берётся из related_service",
    state.brief.serviceId === "LEND",
    `serviceId=${state.brief.serviceId}`
  );
  check(
    "want-similar (no template): orderOptions === {}",
    Object.keys(state.brief.orderOptions).length === 0,
    `orderOptions=${JSON.stringify(state.brief.orderOptions)}`
  );
}

// ---- Тест 3 (регресс): прямой выбор услуги в брифе не предзаполняет опции ----
function testDirectServicePickUnaffected() {
  resetGlobalState();
  state.screen = "brief";
  render();

  document.querySelector('[data-service-pick="BRAND"]').click();

  check(
    "прямой выбор услуги (brief): serviceId установлен",
    state.brief.serviceId === "BRAND",
    `serviceId=${state.brief.serviceId}`
  );
  check(
    "прямой выбор услуги (brief): orderOptions === {} (поведение не менялось)",
    Object.keys(state.brief.orderOptions).length === 0,
    `orderOptions=${JSON.stringify(state.brief.orderOptions)}`
  );
  const checkboxes = Array.from(document.querySelectorAll("[data-order-option-toggle]"));
  check(
    "прямой выбор услуги (brief): ни один checkbox не отмечен",
    checkboxes.length > 0 && checkboxes.every((el) => !el.checked),
    `count=${checkboxes.length} checked=${checkboxes.filter((el) => el.checked).length}`
  );
}

// ---- Тест 4 (регресс): прямой выбор услуги в калькуляторе не предзаполняет опции ----
function testDirectCalculatorPickUnaffected() {
  resetGlobalState();
  state.screen = "calculator";
  render();

  document.querySelector('[data-service="BRAND"]').click();

  check(
    "прямой выбор услуги (calculator): calc.options === {}",
    Object.keys(state.calc.options).length === 0,
    `options=${JSON.stringify(state.calc.options)}`
  );
  const checkboxes = Array.from(document.querySelectorAll("[data-option-toggle]"));
  check(
    "прямой выбор услуги (calculator): ни один checkbox не отмечен",
    checkboxes.length > 0 && checkboxes.every((el) => !el.checked),
    `count=${checkboxes.length} checked=${checkboxes.filter((el) => el.checked).length}`
  );
}

// ---- Тест 5 (регресс): пользовательский выбор опции по-прежнему работает ----
function testUserCanStillCheckOption() {
  resetGlobalState();
  state.currentCase = CASE_WITH_ORDER_TEMPLATE;
  state.screen = "case";
  render();
  document.getElementById("want-similar").click(); // уходим в brief, orderOptions == {}

  const checkbox = document.querySelector('[data-order-option-toggle="BRAND_1"]');
  checkbox.checked = true;
  checkbox.dispatchEvent(new Event("change"));

  check(
    "пользователь всё ещё может сам отметить опцию (не сломали обработчик change)",
    state.brief.orderOptions["BRAND_1"] === 1,
    `orderOptions=${JSON.stringify(state.brief.orderOptions)}`
  );
}

// ---- Тест 6 (регресс): persistBriefDraft/restoreBriefDraft не менялись ----
function testDraftPersistenceUnaffected() {
  resetGlobalState();
  state.brief.serviceId = "BRAND";
  state.brief.orderOptions = { BRAND_1: 2 };
  state.brief.step = 1;
  persistBriefDraft();

  // Симулируем "новый заход" — свежий объект, восстановление из localStorage.
  state.brief.serviceId = null;
  state.brief.orderOptions = {};
  const restored = restoreBriefDraft();

  check(
    "restoreBriefDraft: возвращает true при валидном сохранённом draft'е",
    restored === true,
    `restored=${restored}`
  );
  check(
    "restoreBriefDraft: реальный собственный выбор пользователя восстанавливается как есть",
    state.brief.serviceId === "BRAND" && state.brief.orderOptions.BRAND_1 === 2,
    `serviceId=${state.brief.serviceId} orderOptions=${JSON.stringify(state.brief.orderOptions)}`
  );
  clearBriefDraft();
}

testWantSimilarWithOrderTemplate();
testWantSimilarWithoutOrderTemplate();
testDirectServicePickUnaffected();
testDirectCalculatorPickUnaffected();
testUserCanStillCheckOption();
testDraftPersistenceUnaffected();

const passCount = results.filter((r) => r.pass).length;
const failCount = results.length - passCount;
const lines = results.map((r) => `${r.pass ? "PASS" : "FAIL"}  ${r.name}${r.pass ? "" : "  -- " + r.detail}`);
lines.push("");
lines.push(`TOTAL: ${results.length}  PASS: ${passCount}  FAIL: ${failCount}`);
document.getElementById("results").innerHTML = results
  .map((r) => `<span class="${r.pass ? "pass" : "fail"}">${r.pass ? "PASS" : "FAIL"}</span>  ${r.name}${r.pass ? "" : "  -- " + r.detail}`)
  .join("\n") + `\n\nTOTAL: ${results.length}  PASS: ${passCount}  FAIL: ${failCount}`;
console.log(lines.join("\n"));
window.__TEST_SUMMARY__ = { total: results.length, pass: passCount, fail: failCount, results };
</script>
</body>
</html>
